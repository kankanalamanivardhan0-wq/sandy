<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>For you, about the star</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Lora:ital,wght@0,400;1,400&display=swap">
<style>
:root{--gold:#f4c871;--blush:#ffd1d6;--ink:#fff3ea;--muted:#d9c8e6;box-sizing:border-box;color-scheme:dark;background:#0d0b2a}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{overflow:hidden;color:var(--ink);font-family:'Lora',Georgia,serif;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;background:#0d0b2a}
#bg{position:fixed;inset:0;width:100%;height:100%}
#moon{transition:transform .6s ease-out}
.cl{animation:cl 40s linear infinite alternate}.cl2{animation-duration:55s;animation-direction:alternate-reverse}
@keyframes cl{to{transform:translateX(60px)}}
.tw{animation:tw 3.5s ease-in-out infinite}@keyframes tw{50%{opacity:.15}}
.sway{animation:sw 3s ease-in-out infinite alternate;transform-origin:126px 548px}@keyframes sw{to{transform:rotate(-7deg)}}
.flick{animation:fl 2.2s ease-in-out infinite}@keyframes fl{50%{opacity:.6}}
#girl,#him{transition:opacity 1.6s ease}
body:not([data-p=scene]):not([data-p=letter]) #girl{opacity:0}
#him{opacity:0}body[data-p=letter] #him{opacity:1}
#gstar{animation:gs 2.4s ease-in-out infinite alternate;transform-origin:214px 570px}@keyframes gs{to{transform:scale(1.18) rotate(8deg)}}
body[data-p=letter] #gstar{filter:url(#glow)}
canvas{position:fixed;inset:0;width:100%;height:100%;z-index:2;pointer-events:none;touch-action:none}
body[data-p=draw] canvas{pointer-events:auto}
.pg{position:fixed;inset:0;z-index:1;opacity:0;pointer-events:none;transition:opacity 1.4s ease;display:flex;flex-direction:column;align-items:center;text-align:center;padding:calc(12vh + env(safe-area-inset-top,0px)) 28px 0}
.pg.on{opacity:1}
.t{margin:0 auto;max-width:27rem;font-size:clamp(1.4rem,5.6vw,1.85rem);line-height:1.5;color:#fff;background:rgba(14,8,36,.68);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid rgba(255,220,180,.3);border-radius:24px;padding:1.1em 1.3em;box-shadow:0 10px 40px rgba(8,4,24,.55);opacity:0;transform:translateY(10px);transition:opacity 1.1s ease,transform 1.1s ease}.t span{opacity:0;animation:lt .6s ease forwards}@keyframes lt{from{opacity:0;filter:blur(6px)}to{opacity:1;filter:none}}
.t.on{opacity:1;transform:none}
.h{font-family:'Caveat','Segoe Script',cursive;font-weight:700;color:var(--blush);line-height:1.2}
#cover{justify-content:center;padding-top:0}
#cover h1{font-size:clamp(3rem,15vw,5.2rem);margin:0 0 .3em;text-shadow:0 0 40px rgba(255,160,190,.7)}
#cover p{font-size:1.1rem;color:var(--muted);margin:0}
#letter .t{font-size:clamp(2rem,8vw,2.7rem)}
.hint{position:fixed;left:0;right:0;z-index:3;bottom:calc(26px + env(safe-area-inset-bottom,0px));text-align:center;font-family:'Caveat','Segoe Script',cursive;font-size:1.5rem;color:var(--muted);pointer-events:none;animation:pu 3s ease-in-out infinite;transition:opacity 1s}
@keyframes pu{50%{opacity:.4}}
.btn{position:fixed;z-index:4;left:50%;bottom:calc(34px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);padding:.7em 1.6em;border-radius:99px;border:1.5px solid var(--gold);background:rgba(20,10,45,.55);color:var(--gold);font:700 1.5rem 'Caveat','Segoe Script',cursive;opacity:0;pointer-events:none;transition:opacity 1.2s;backdrop-filter:blur(8px)}
.btn.on{opacity:1;pointer-events:auto}.btn:focus-visible{outline:3px solid var(--blush);outline-offset:3px}
@media (prefers-reduced-motion:reduce){.cl,.tw,.sway,.flick,#gstar,.hint{animation:none}.t,.pg{transition:none}.t span{animation:none;opacity:1}}
</style>
</head>
<body data-p="cover">
<svg id="bg" viewBox="0 0 400 800" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
<defs>
<linearGradient id="sk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b0a29"/><stop offset=".38" stop-color="#2f1f5e"/><stop offset=".68" stop-color="#9c4a86"/><stop offset=".84" stop-color="#ff9a8a"/><stop offset="1" stop-color="#ffd29a"/></linearGradient>
<radialGradient id="mg"><stop offset="0" stop-color="#fff6e0" stop-opacity=".9"/><stop offset=".35" stop-color="#ffd9e6" stop-opacity=".35"/><stop offset="1" stop-color="#ffd9e6" stop-opacity="0"/></radialGradient>
<radialGradient id="lg"><stop offset="0" stop-color="#ffd27a" stop-opacity=".95"/><stop offset="1" stop-color="#ffd27a" stop-opacity="0"/></radialGradient>
<filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="bl"><feGaussianBlur stdDeviation="9"/></filter>
</defs>
<rect width="400" height="800" fill="url(#sk)"/>
<g id="stars"></g>
<g id="moon"><circle cx="305" cy="125" r="115" fill="url(#mg)" opacity=".55"/><circle cx="305" cy="125" r="42" fill="#fff4dc"/><circle cx="294" cy="116" r="6" fill="#f1dcc0" opacity=".6"/><circle cx="316" cy="138" r="4" fill="#f1dcc0" opacity=".5"/></g>
<g filter="url(#bl)"><ellipse class="cl" cx="90" cy="470" rx="120" ry="16" fill="#ffb4b8" opacity=".55"/><ellipse class="cl cl2" cx="300" cy="520" rx="130" ry="14" fill="#ff9fb0" opacity=".5"/><ellipse class="cl" cx="200" cy="400" rx="90" ry="10" fill="#d9a0e0" opacity=".35"/></g>
<path d="M0 640 C90 600 170 622 260 604 C330 592 370 600 400 590 L400 800 L0 800Z" fill="#2a1650"/>
<g id="city" fill="#ffd98a"></g>
<path d="M0 700 C80 652 160 670 230 664 C300 660 350 642 400 656 L400 800 L0 800Z" fill="#0f0824"/>
<g id="lan"><circle cx="205" cy="650" r="46" fill="url(#lg)" class="flick"/><rect x="199" y="640" width="12" height="16" rx="3" fill="#ffd27a"/></g>
<g id="girl">
<path class="sway" d="M126 548 C100 540 90 562 66 552" stroke="#ff8fa8" stroke-width="4" fill="none" stroke-linecap="round"/>
<path d="M120 556 C106 562 102 620 110 662 L170 662 C178 620 174 562 160 556Z" fill="#170d2e"/>
<circle cx="140" cy="552" r="21" fill="#170d2e"/>
<path d="M159 540 C167 560 170 620 166 655" stroke="#ffb7c5" stroke-width="2" fill="none" opacity=".7"/>
<path d="M108 664 C106 640 120 624 140 624 C160 624 174 640 172 664Z" fill="#2b1a4d"/>
<path d="M164 636 C186 626 201 602 212 582" stroke="#2b1a4d" stroke-width="9" fill="none" stroke-linecap="round"/>
<path id="gstar" d="M214 553 L219 565 L232 566 L222 574 L225 587 L214 580 L203 587 L206 574 L196 566 L209 565Z" fill="#f4c871" stroke="#fff0c0" stroke-width="1.5" stroke-linejoin="round"/>
</g>
<g id="him"><circle cx="276" cy="556" r="22" fill="#170d2e"/><path d="M244 664 C240 638 256 622 276 622 C298 622 312 638 310 664Z" fill="#241540"/><path d="M262 538 C272 530 288 534 294 546" stroke="#ffb7c5" stroke-width="2" fill="none" opacity=".6"/></g>
</svg>

<section class="pg on" id="cover"><h1 class="h">For you,<br>about the star</h1><p>tap to begin</p></section>
<section class="pg" id="scene"></section>
<section class="pg" id="draw"></section>
<section class="pg" id="letter"></section>
<canvas id="c"></canvas>
<div class="hint" id="hint"></div>
<button class="btn" id="next" type="button">read my letter</button>

<script>
(function(){
var NS='http://www.w3.org/2000/svg',$=function(i){return document.getElementById(i)};
var rm=matchMedia('(prefers-reduced-motion: reduce)').matches;
var st=$('stars');for(var i=0;i<80;i++){var c=document.createElementNS(NS,'circle');c.setAttribute('cx',Math.random()*400);c.setAttribute('cy',Math.random()*420);c.setAttribute('r',(Math.random()*1.2+.3).toFixed(2));c.setAttribute('fill','#fff');c.setAttribute('class','tw');c.style.animationDelay=(Math.random()*4)+'s';st.appendChild(c)}
var ci=$('city');for(i=0;i<26;i++){c=document.createElementNS(NS,'circle');var x=Math.random()*400;c.setAttribute('cx',x);c.setAttribute('cy',618+Math.random()*30-x*.02);c.setAttribute('r',(Math.random()*1.2+.5).toFixed(1));c.setAttribute('opacity',(.4+Math.random()*.6).toFixed(2));ci.appendChild(c)}
document.addEventListener('pointermove',function(e){if(rm)return;if(pg!==2)burst(e.clientX,e.clientY,1,'255,225,170');$('moon').style.transform='translate('+((e.clientX/innerWidth-.5)*-14)+'px,'+((e.clientY/innerHeight-.5)*-10)+'px)'});

var cv=$('c'),ctx=cv.getContext('2d'),hint=$('hint'),btn=$('next'),W,H,D=Math.min(devicePixelRatio||1,2);
function rs(){W=innerWidth;H=innerHeight;cv.width=W*D;cv.height=H*D;ctx.setTransform(D,0,0,D,0,0)}addEventListener('resize',rs);rs();
var pg=0,ph=0,pages=['cover','scene','draw','letter'],stars=[],cur=null,parts=[],hearts=0,petals=[];
for(i=0;i<(rm?0:26);i++)petals.push({x:Math.random()*W,y:Math.random()*H,vx:.3+Math.random()*.6,vy:.5+Math.random()*.9,r:3+Math.random()*4,a:Math.random()*6,va:(Math.random()-.5)*.05});

function put(id,txt,cls){var s=$(id),o=s.firstChild;if(o)o.classList.remove('on');setTimeout(function(){s.innerHTML='';var p=document.createElement('p');p.className='t '+(cls||'');for(var i=0;i<txt.length;i++){var sp=document.createElement('span');sp.textContent=txt[i];sp.style.animationDelay=(500+i*32)+'ms';p.appendChild(sp)}s.appendChild(p);void p.offsetWidth;p.classList.add('on')},o?650:0)}
var beats=['Awww, you really wanted to make that star, didn’t you?','It’s okay, sweetheart. I know you wanted it to turn out beautifully.','Don’t be upset. I wish I could’ve been there to see you trying so hard.'];
var FINAL='Even if the star didn’t turn out the way you wanted, I hope you know that doesn’t make the moment any less lovely.';

function go(n){pg=n;ph=0;document.body.dataset.p=pages[n];[].forEach.call(document.querySelectorAll('.pg'),function(e,k){e.classList.toggle('on',k===n)});btn.classList.remove('on');hint.style.opacity=1;
 if(n===1){hint.textContent='tap';setTimeout(function(){put('scene',beats[0]);ph=1},900)}
 if(n===2){hint.textContent='draw a star with your finger';stars=[];setTimeout(function(){put('draw','Now draw it again. Any shape. It will be perfect.')},900)}
 if(n===3){tL=performance.now();hint.textContent='';hearts=1;setTimeout(function(){put('letter',FINAL,'h')},1800);setTimeout(function(){btn.textContent='start over';btn.classList.add('on');btn.dataset.m='r'},9000)}
 if(n===0){hearts=0;hint.textContent='';}}
document.body.addEventListener('click',function(e){
 if(e.target===btn)return;burst(e.clientX,e.clientY,26,'255,190,225');
 if(pg===0)go(1);
 else if(pg===1){if(ph>=1&&ph<3){put('scene',beats[ph]);ph++}else if(ph===3)go(2)}});
btn.addEventListener('click',function(){if(btn.dataset.m==='r'){btn.dataset.m='';go(0)}else go(3)});

function burst(x,y,n,col){if(rm)n=Math.round(n/4);for(var i=0;i<n;i++){var a=Math.random()*6.28,s=.6+Math.random()*3.2;parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:0,m:50+Math.random()*50,c:col||'255,214,140',h:0,r:1+Math.random()*2})}}
function heart(){parts.push({x:Math.random()*W,y:H+20,vx:(Math.random()-.5)*.6,vy:-(.8+Math.random()*1.2),l:0,m:300,c:'255,150,175',h:1,r:10+Math.random()*16})}
function pt(e){return{x:e.clientX,y:e.clientY}}
cv.addEventListener('pointerdown',function(e){cur=[pt(e)];hint.style.opacity=0;try{cv.setPointerCapture(e.pointerId)}catch(_){}});
cv.addEventListener('pointermove',function(e){if(!cur)return;var p=pt(e),q=cur[cur.length-1];if(Math.hypot(p.x-q.x,p.y-q.y)>3){cur.push(p);burst(p.x,p.y,2,'255,225,170')}});
function end(){if(!cur)return;var pts=cur;cur=null;
 if(pts.length<6){var c=pts[0],P=[];for(var i=0;i<10;i++){var a=-1.5708+i*.6283,r=(i%2?15:36)*(.85+Math.random()*.3);P.push({x:c.x+Math.cos(a)*r,y:c.y+Math.sin(a)*r})}pts=P}
 else{var k=Math.ceil(pts.length/40),Q=[];for(var j=0;j<pts.length;j+=k)Q.push(pts[j]);pts=Q}
 var cx=0,cy=0;pts.forEach(function(p){cx+=p.x;cy+=p.y});cx/=pts.length;cy/=pts.length;
 stars.push({cx:cx,cy:cy,rel:pts.map(function(p){return{x:p.x-cx,y:p.y-cy}}),born:performance.now(),seed:Math.random()*6.28});burst(cx,cy,60);
 var n=stars.length;if(n===1)put('draw','See? Already beautiful.');else if(n===2)put('draw','One more…');else if(n===3){put('draw','There you go.');setTimeout(function(){btn.textContent='read my letter';btn.dataset.m='';btn.classList.add('on')},2800)}}
cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);
function path(p,ox,oy,s){ctx.beginPath();p.forEach(function(q,i){var x=ox+q.x*s,y=oy+q.y*s;i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.closePath()}
var mt=[],tL=0,last=performance.now();
function frame(now){var dt=Math.min((now-last)/16.7,3);last=now;ctx.clearRect(0,0,W,H);ctx.globalCompositeOperation='source-over';
 petals.forEach(function(p){p.x+=p.vx*dt;p.y+=p.vy*dt;p.a+=p.va*dt;if(p.y>H+10||p.x>W+10){p.y=-10;p.x=Math.random()*W-40}
  ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.a);ctx.fillStyle='rgba(255,190,208,.75)';ctx.beginPath();ctx.ellipse(0,0,p.r,p.r*.55,0,0,6.283);ctx.fill();ctx.restore()});
 if(pg===2||pg===3)stars.forEach(function(s){var a=Math.min(1,(now-s.born)/1400),b=rm?0:Math.sin(now/900+s.seed)*3,sc=(1+(rm?0:Math.sin(now/450+s.seed)*.05))*(.6+.4*a);
  ctx.shadowColor='rgba(255,200,110,.95)';ctx.shadowBlur=34*a;ctx.fillStyle='rgba(255,206,120,'+.88*a+')';path(s.rel,s.cx,s.cy+b,sc);ctx.fill();
  ctx.strokeStyle='rgba(255,240,200,'+a+')';ctx.lineWidth=2.4;ctx.lineJoin='round';ctx.stroke();ctx.shadowBlur=0});
 if(pg===3&&stars.length>1){ctx.strokeStyle='rgba(255,214,140,.45)';ctx.lineWidth=1.2;ctx.setLineDash([4,7]);ctx.beginPath();stars.forEach(function(s,i){i?ctx.lineTo(s.cx,s.cy):ctx.moveTo(s.cx,s.cy)});ctx.stroke();ctx.setLineDash([])}
 if(cur&&cur.length>1){ctx.shadowColor='#ffc86e';ctx.shadowBlur=18;ctx.strokeStyle='#ffe3a6';ctx.lineWidth=3.2;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();cur.forEach(function(p,i){i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y)});ctx.stroke();ctx.shadowBlur=0}
 if(pg===3){var q=Math.min(1,(now-tL-3500)/5000),hs=Math.min(W,H)/46;for(var t=0;t<62;t++){if(t/62>q)break;var u=t/62*6.2832,hx=16*Math.pow(Math.sin(u),3),hy=-(13*Math.cos(u)-5*Math.cos(2*u)-2*Math.cos(3*u)-Math.cos(4*u));ctx.fillStyle='rgba(255,215,150,'+(.55+.4*Math.sin(now/400+t))+')';ctx.shadowColor='#ffc86e';ctx.shadowBlur=14;ctx.beginPath();ctx.arc(W/2+hx*hs,H*.5+hy*hs,2.2,0,6.283);ctx.fill();ctx.shadowBlur=0}
if(!rm&&Math.random()<.025*dt)mt.push({x:Math.random()*W+100,y:Math.random()*H*.4,l:0})}
mt=mt.filter(function(m){return m.l<60});mt.forEach(function(m){m.l+=dt;m.x-=9*dt;m.y+=4.5*dt;var g=ctx.createLinearGradient(m.x,m.y,m.x+90,m.y-45);g.addColorStop(0,'rgba(255,240,215,.95)');g.addColorStop(1,'rgba(255,240,215,0)');ctx.strokeStyle=g;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(m.x,m.y);ctx.lineTo(m.x+90,m.y-45);ctx.stroke()});
if(hearts&&!rm&&Math.random()<.06*dt)heart();
 ctx.globalCompositeOperation='lighter';parts=parts.filter(function(p){return p.l<p.m});
 parts.forEach(function(p){p.l+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(!p.h){p.vx*=.97;p.vy=p.vy*.97+.012}var al=1-p.l/p.m;
  if(p.h){ctx.fillStyle='rgba('+p.c+','+al*.8+')';ctx.font=p.r*1.6+'px serif';ctx.textAlign='center';ctx.fillText('♥',p.x+Math.sin(p.l/18)*10,p.y)}
  else{ctx.fillStyle='rgba('+p.c+','+al+')';ctx.beginPath();ctx.arc(p.x,p.y,p.r*al+.3,0,6.283);ctx.fill()}});
 ctx.globalCompositeOperation='source-over';requestAnimationFrame(frame)}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
